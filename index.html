<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voice Notes">
  <title>Voice Notes Reorder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .editable-text {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col font-sans antialiased">

  <header class="p-4 border-b border-neutral-800 bg-neutral-900/60 backdrop-blur sticky top-0 z-20 flex justify-between items-center">
    <h1 class="text-lg font-bold tracking-tight">Voice Notes</h1>
    <span id="note-count" class="text-xs text-neutral-400 font-mono">0 notes</span>
  </header>

  <main class="flex-1 p-4 pb-32 overflow-y-auto">
    <div id="notes-container" class="space-y-3">
      <!-- Notes render here -->
    </div>
  </main>

  <footer class="fixed bottom-0 left-0 right-0 p-4 bg-neutral-900/90 border-t border-neutral-800 backdrop-blur z-20">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div id="status" class="text-xs text-neutral-400 truncate flex-1 font-mono">Ready</div>
      <button id="record-btn" class="w-14 h-14 rounded-full bg-red-600 active:bg-red-700 flex items-center justify-center shadow-lg transition-transform active:scale-95">
        <div id="record-icon" class="w-6 h-6 rounded-full bg-white transition-all"></div>
      </button>
    </div>
  </footer>

  <script>
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recognition = null;
    let interimTranscript = '';
    let notes = [];

    const recordBtn = document.getElementById('record-btn');
    const recordIcon = document.getElementById('record-icon');
    const statusEl = document.getElementById('status');
    const container = document.getElementById('notes-container');
    const noteCountEl = document.getElementById('note-count');

    // Speech Recognition Setup (Webkit prefix for Safari)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (e) => {
        let transcript = '';
        for (let i = 0; i < e.results.length; ++i) {
          transcript += e.results[i][0].transcript;
        }
        interimTranscript = transcript;
        statusEl.innerText = transcript || 'Listening...';
      };

      recognition.onerror = () => {
        statusEl.innerText = 'Speech recognition error';
      };
    }

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Match iOS supported MIME types
        let mimeType = 'audio/mp4';
        if (!MediaRecorder.isTypeSupported('audio/mp4')) {
          mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        }

        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        audioChunks = [];
        interimTranscript = '';

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/mp4' });
          const audioUrl = URL.createObjectURL(blob);
          saveNote(audioUrl, interimTranscript || 'Untitled Voice Note');
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        if (recognition) recognition.start();

        isRecording = true;
        recordIcon.className = 'w-5 h-5 rounded-sm bg-white';
        statusEl.innerText = 'Recording...';
      } catch (err) {
        statusEl.innerText = 'Microphone access denied';
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (recognition) recognition.stop();

      isRecording = false;
      recordIcon.className = 'w-6 h-6 rounded-full bg-white';
      statusEl.innerText = 'Ready';
    }

    function saveNote(audioUrl, transcript) {
      const note = {
        id: Date.now(),
        audioUrl,
        transcript,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      notes.unshift(note);
      renderNotes();
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      renderNotes();
    }

    function moveNote(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= notes.length) return;
      const temp = notes[index];
      notes[index] = notes[targetIndex];
      notes[targetIndex] = temp;
      renderNotes();
    }

    function renderNotes() {
      noteCountEl.innerText = `${notes.length} note${notes.length === 1 ? '' : 's'}`;
      container.innerHTML = '';

      if (notes.length === 0) {
        container.innerHTML = '<div class="text-neutral-500 text-center py-10 text-sm">No notes recorded yet.</div>';
        return;
      }

      notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = 'bg-neutral-900 border border-neutral-800 rounded-lg p-3 flex flex-col gap-2 shadow-sm';
        card.innerHTML = `
          <div class="flex items-center justify-between text-xs text-neutral-500 font-mono">
            <span>${note.timestamp}</span>
            <div class="flex items-center gap-1">
              <button onclick="moveNote(${index}, -1)" class="p-1 hover:text-white ${index === 0 ? 'opacity-20 pointer-events-none' : ''}">▲</button>
              <button onclick="moveNote(${index}, 1)" class="p-1 hover:text-white ${index === notes.length - 1 ? 'opacity-20 pointer-events-none' : ''}">▼</button>
              <button onclick="deleteNote(${note.id})" class="p-1 hover:text-red-400 ml-2">✕</button>
            </div>
          </div>
          <div contenteditable="true" class="editable-text text-sm text-neutral-200 outline-none focus:text-white">${note.transcript}</div>
          <audio controls src="${note.audioUrl}" class="w-full h-8 mt-1"></audio>
        `;
        container.appendChild(card);
      });
    }

    window.moveNote = moveNote;
    window.deleteNote = deleteNote;
    renderNotes();
  </script>
</body>
</html>
